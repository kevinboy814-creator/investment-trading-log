function el(tag,a={}){let n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));return n}
function buttons(){let b=document.getElementById('seriesBtns');Object.keys(C).forEach(k=>{let x=document.createElement('button');x.textContent=k;x.className='active';x.onclick=()=>{visible.has(k)?visible.delete(k):visible.add(k);x.classList.toggle('active');draw()};b.appendChild(x)});let r=document.getElementById('rangeBtns');['1M','3M','6M','ALL'].forEach(k=>{let x=document.createElement('button');x.textContent=k;x.className=k==='ALL'?'active':'';x.onclick=()=>{range=k;[...r.children].forEach(z=>z.classList.remove('active'));x.classList.add('active');draw()};r.appendChild(x)})}

function inspect(clientX,clientY){let rect=wrap.getBoundingClientRect(),x=clientX-rect.left,W=wrap.clientWidth,a=+svg.dataset.a,z=+svg.dataset.z,pl=+svg.dataset.pl,pr=+svg.dataset.pr;if(x<pl||x>W-pr)return;let i=Math.round(a+(x-pl)/(W-pl-pr)*(z-a));i=Math.max(a,Math.min(z,i));let cx=pl+(i-a)/(z-a)*(W-pl-pr),cross=svg.querySelector('#cross');cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('visibility','visible');let rows=[...visible].map(k=>`<div><span style="color:${C[k]}">●</span> ${k}：<b>${data[k][i].toFixed(2)}</b></div>`).join('');let ev=data.events.find(e=>e.date===data.dates[i]);tip.innerHTML=`<b>${data.dates[i]}</b>${rows}${ev?`<hr style="border-color:#294b39"><div style="color:${ev.color}"><b>${ev.type}</b>｜${ev.note}</div>`:''}`;tip.style.display='block';let left=Math.min(Math.max(6,cx+10),W-tip.offsetWidth-6);tip.style.left=left+'px';tip.style.top='38px'}
