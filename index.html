<html lang="zh-TW">

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1711;color:#d6e5dc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px 14px 50px}
h1{font-size:24px;color:#55d5a6;margin:10px 0 3px}
.sub{color:#7fa18e;font-size:13px}
.card{background:#12251b;border:1px solid #244533;border-radius:16px;padding:12px;margin-top:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{border:1px solid #315b45;background:#173326;color:#cfe2d7;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}
button.active{background:#55d5a6;color:#092016}
#chartWrap{position:relative;width:100%;height:430px;touch-action:pan-y}
svg{width:100%;height:100%;display:block}
#tip{position:absolute;display:none;pointer-events:none;min-width:190px;background:rgba(8,22,15,.97);border:1px solid #4d8065;border-radius:10px;padding:10px;font-size:12px;z-index:4;box-shadow:0 8px 24px #0008}
#tip b{color:#65ddb1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.event{border-left:3px solid #55d5a6;padding:10px 12px;margin:8px 0;background:#102218;border-radius:8px}
.event.sell{border-color:#ef6666}
.event.stop{border-color:#ee875b}
.event strong{display:inline-block;min-width:76px}
.note{font-size:12px;color:#7fa18e;margin-top:8px;line-height:1.6}.disclaimer{margin-top:14px;padding:10px 12px;border:1px solid #2a4c39;background:#0f2118;border-radius:10px;color:#7f9b8c;font-size:11px;line-height:1.65}
@media(max-width:600px){
  .wrap{padding:12px 8px 35px}
  h1{font-size:20px}
  #chartWrap{height:390px}
  .card{border-radius:12px;padding:9px}
  button{padding:7px 10px;font-size:12px}
}
</style>

  </div>

  <div class="disclaimer">本頁為個人資產配置與交易紀錄，僅供個人紀錄及經驗分享，不構成任何金融商品之推薦、招攬、投資建議或獲利保證。圖表所示為各市場標的之相對走勢與個人操作時點，非本人投資組合之實際報酬率。</div>

,102.93,105.18,109.37,107.13,106.22,105.73,107.2,108.81,106.29,106.15,103.84,104.05,106.57,106.01,104.9,103.35,101.18,105.52,103.42,null,105.3,110.76,110.69,112.93,112.72,116.22,117.69,118.88,117.69,118.25,120.28,120.77,120.77,125.81,130.07,128.66,126.92,126.57,null,132.31,132.31,133.91,136.64,135.65,135.51,135.44,133.56,134.33,133.42,132.73,130.21,129.37,134.05,136.08,139.99,143.42,140.55,147.4,147.54,147.83,150.49,148.39,145.66,141.18,144.74,140.2,null,142.58,147.19,148.11,148.25,150.06,155.45,153.97,149.85,149.92,144.2,146.08,150.77,152.93,152.16,151.4,148.53,148.32,147.97,147.97,148.25,146.01,148.67,null,140.06,138.74,144.22,146.12,146.19,143.1,142.75,136.7,131.84,131.56,144.72,143.52,141.62,146.05,145.35,144.72,146.69,147.18,148.02]};
const C={SOXX:'#4CAF50',QQQ:'#2196F3',SMH:'#FF9800',SPY:'#9C27B0','0050':'#E0B84A'};
let visible=new Set(Object.keys(C)), range='ALL';

const svg=document.getElementById('chart');
const wrap=document.getElementById('chartWrap');
const tip=document.getElementById('tip');

function el(tag,a={}){
  const n=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));
  return n;
}

function buttons(){
  const b=document.getElementById('seriesBtns');
  Object.keys(C).forEach(k=>{
    const x=document.createElement('button');
    x.textContent=k;
    x.className='active';
    x.onclick=()=>{
      visible.has(k)?visible.delete(k):visible.add(k);
      x.classList.toggle('active');
      draw();
    };
    b.appendChild(x);
  });
  const r=document.getElementById('rangeBtns');
  ['1M','3M','6M','ALL'].forEach(k=>{
    const x=document.createElement('button');
    x.textContent=k;
    x.className=k==='ALL'?'active':'';
    x.onclick=()=>{
      range=k;
      [...r.children].forEach(z=>z.classList.remove('active'));
      x.classList.add('active');
      draw();
    };
    r.appendChild(x);
  });
}

function idxs(){
  const n=data.dates.length;
  if(range==='ALL') return [0,n-1];
  const days={'1M':22,'3M':66,'6M':132}[range];
  return [Math.max(0,n-days),n-1];
}

function validVals(arr,a,z){
  return arr.slice(a,z+1).filter(v=>Number.isFinite(v));
}

function draw(){
  svg.innerHTML='';
  const W=wrap.clientWidth,H=wrap.clientHeight,p={l:44,r:12,t:24,b:35};
  const [a,z]=idxs();
  let ys=[];
  visible.forEach(k=>ys.push(...validVals(data[k],a,z)));
  if(!ys.length) ys=[90,110];
  const ymin=Math.min(...ys)-3, ymax=Math.max(...ys)+3;
  const X=i=>p.l+(i-a)/Math.max(1,(z-a))*(W-p.l-p.r);
  const Y=v=>p.t+(ymax-v)/(ymax-ymin)*(H-p.t-p.b);

  for(let j=0;j<5;j++){
    const y=p.t+j*(H-p.t-p.b)/4;
    svg.appendChild(el('line',{x1:p.l,x2:W-p.r,y1:y,y2:y,stroke:'#244533'}));
    const t=el('text',{x:4,y:y+4,fill:'#789b87','font-size':10});
    t.textContent=(ymax-j*(ymax-ymin)/4).toFixed(0);
    svg.appendChild(t);
  }

  visible.forEach(k=>{
    const pts=[];
    for(let i=a;i<=z;i++){
      const v=data[k][i];
      if(Number.isFinite(v)) pts.push(`${X(i)},${Y(v)}`);
    }
    if(pts.length>1){
      svg.appendChild(el('polyline',{points:pts.join(' '),fill:'none',stroke:C[k],'stroke-width':k==='0050'?2.6:2.2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    }
  });

  data.events.forEach(e=>{
    let i=data.dates.indexOf(e.date);
    if(i<0){
      const target=new Date(e.date);
      let best=-1,bestDiff=Infinity;
      data.dates.forEach((d,idx)=>{
        const diff=Math.abs(new Date(d)-target);
        if(diff<bestDiff){bestDiff=diff;best=idx;}
      });
      i=best;
    }
    if(i<a||i>z) return;
    const x=X(i);
    svg.appendChild(el('line',{x1:x,x2:x,y1:p.t,y2:H-p.b,stroke:e.color,'stroke-width':1.2,'stroke-dasharray':'4 4'}));
    svg.appendChild(el('circle',{cx:x,cy:p.t+8,r:6,fill:e.color,stroke:'#fff','stroke-width':1.5}));
  });

  const cross=el('line',{id:'cross',x1:0,x2:0,y1:p.t,y2:H-p.b,stroke:'#d9eee3','stroke-width':1,'stroke-dasharray':'3 3',visibility:'hidden'});
  svg.appendChild(cross);
  svg.dataset.a=a;svg.dataset.z=z;svg.dataset.pl=p.l;svg.dataset.pr=p.r;
}

function inspect(clientX){
  const rect=wrap.getBoundingClientRect(),x=clientX-rect.left,W=wrap.clientWidth;
  const a=+svg.dataset.a,z=+svg.dataset.z,pl=+svg.dataset.pl,pr=+svg.dataset.pr;
  if(x<pl||x>W-pr) return;
  let i=Math.round(a+(x-pl)/(W-pl-pr)*(z-a));
  i=Math.max(a,Math.min(z,i));
  const cx=pl+(i-a)/Math.max(1,(z-a))*(W-pl-pr);
  const cross=svg.querySelector('#cross');
  cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('visibility','visible');

  const rows=[...visible].map(k=>{
    const v=data[k][i];
    return `<div><span style="color:${C[k]}">●</span> ${k}：<b>${Number.isFinite(v)?v.toFixed(2):'—'}</b></div>`;
  }).join('');

  const ev=data.events.find(e=>e.date===data.dates[i]);
  tip.innerHTML=`<b>${data.dates[i]}</b>${rows}${ev?`<hr style="border-color:#294b39"><div style="color:${ev.color}"><b>${ev.type}</b>｜${ev.note}</div>`:''}`;
  tip.style.display='block';
  const left=Math.min(Math.max(6,cx+10),W-tip.offsetWidth-6);
  tip.style.left=left+'px'; tip.style.top='38px';
}

wrap.addEventListener('mousemove',e=>inspect(e.clientX));
wrap.addEventListener('mouseleave',()=>{
  tip.style.display='none';
  const c=svg.querySelector('#cross');
  if(c)c.setAttribute('visibility','hidden');
});
wrap.addEventListener('touchstart',e=>inspect(e.touches[0].clientX),{passive:true});
wrap.addEventListener('touchmove',e=>inspect(e.touches[0].clientX),{passive:true});

function renderEvents(){
  document.getElementById('events').innerHTML=data.events.map(e=>`<div class="event ${e.type==='減碼'?'sell':e.type==='停止加碼'?'stop':''}"><strong>${e.date}</strong><b style="color:${e.color}">${e.type}</b><div>${e.note}</div></div>`).join('');
}
function legend(){
  document.getElementById('legend').innerHTML=Object.keys(C).map(k=>`<span><i class="dot" style="background:${C[k]}"></i>${k}</span>`).join('');
}

buttons();legend();renderEvents();draw();
window.addEventListener('resize',draw);
</script>

</html>
